<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Dungeon Radio</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #1d1d24; --muted: #5c5c6b; --line: #e3e3ea; --accent: #7d2fd0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #13131a; --text: #ececf1; --muted: #a9a9b8; --line: #2c2c38; --accent: #c690ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 21px; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .updated, .muted { color: var(--muted); }
  a { color: var(--accent); }
  nav { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .summary { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 12px; padding: 4px 18px; }
</style>
</head>
<body>
<main>
<nav aria-label="Legal pages"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Use</a><a href="/licenses">Licenses</a></nav>
{{body}}
</main>
</body>
</html>
