# Builds the Mac app's DMG on a Mac and publishes it as the "Mac app (latest)"
# release, so the newest build is always one click away:
#   https://github.com/jigonoso-hue/Soundboard/releases/tag/mac-latest
# Runs when the Mac app changes on main, or by hand (Actions → Mac DMG → Run workflow).
name: Mac DMG

on:
  push:
    branches: [main]
    paths: ['soundboard-mac/**', '.github/workflows/mac-dmg.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-dmg
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: soundboard-mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soundboard-mac/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      # No Developer ID yet, so the app is ad-hoc signed ("-"). Without any
      # signature, macOS calls a downloaded app "damaged" and won't open it;
      # ad-hoc signed, it asks once ("Open Anyway") and then opens normally.
      # Hardened runtime is for notarization; with an ad-hoc signature it can
      # stop the app's own libraries from loading, so it's off until there's a
      # Developer ID.
      - name: Build the DMGs (Apple Silicon and Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      # Every app in every DMG must have a valid signature, or don't publish.
      - name: Check the signatures
        run: |
          for dmg in dist/*.dmg; do
            mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
            codesign --verify --deep --strict --verbose=2 "$mount/Dungeon Radio.app"
            codesign -dv "$mount/Dungeon Radio.app" 2>&1 | grep -E "Signature|Identifier|Format"
            hdiutil detach "$mount"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-radio-mac
          path: soundboard-mac/dist/*.dmg

      - name: Publish as the "mac-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest dist/*.dmg \
            --title "Dungeon Radio for Mac (latest)" \
            --target "$GITHUB_SHA" \
            --notes "Built from $(git rev-parse --short HEAD) on $(date -u '+%Y-%m-%d %H:%M UTC').

          Download **arm64** for Apple Silicon Macs (M1 and later), **x64** for Intel Macs.

          The app isn't notarized by Apple yet, so the first time: open the DMG, drag Dungeon Radio to Applications, then **right-click it → Open → Open** (or System Settings → Privacy & Security → Open Anyway)."
